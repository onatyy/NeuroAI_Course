name: Submit Content

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SME
        run: |
          if ! grep -Fxq "${{ github.actor }}" .github/smes.txt; then
            echo "❌ You are not authorized to submit content."
            exit 1
          fi

          echo "✅ ${{ github.actor }} is an approved SME."

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo neuromatch/NeuroAI_Course \
            --base main \
            --head onatyy:main \
            --title "Content submission by ${{ github.actor }}" \
            --body "Automated content submission from ${{ github.actor }}."
